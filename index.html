<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bal Hindi Pronunciation Practice</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .timer-ring {
            transition: stroke-dashoffset 1s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }
    </style>
</head>
<body class="bg-amber-50 flex flex-col items-center justify-center min-h-screen font-sans p-4">

    <!-- Category Tabs for Kids -->
    <div class="flex flex-wrap gap-2 justify-center mb-6 max-w-md w-full">
        <button onclick="switchCategory('twoLetter')" id="tab-twoLetter" class="category-tab px-4 py-2 bg-amber-400 text-amber-900 font-bold rounded-full shadow-md text-sm transition-all border-2 border-amber-500 cursor-pointer">२ अक्षर वाले</button>
        <button onclick="switchCategory('threeLetter')" id="tab-threeLetter" class="category-tab px-4 py-2 bg-white text-slate-600 font-bold rounded-full shadow-md text-sm transition-all border-2 border-transparent cursor-pointer">३ अक्षर वाले</button>
        <button onclick="switchCategory('matra')" id="tab-matra" class="category-tab px-4 py-2 bg-white text-slate-600 font-bold rounded-full shadow-md text-sm transition-all border-2 border-transparent cursor-pointer">मात्रा वाले शब्द</button>
    </div>

    <!-- Main Card Box -->
    <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center relative border-4 border-amber-200">
        
        <h1 class="text-xl font-black text-amber-600 tracking-wide mb-6">आओ हिंदी सीखें! 🌟</h1>

        <!-- Word Display Area -->
        <div class="bg-amber-100/50 py-8 rounded-2xl border-2 border-dashed border-amber-300 mb-6">
            <div id="hindi-word" class="text-6xl font-black text-amber-700 tracking-wider mb-3">घर</div>
            <div id="english-meaning" class="text-base text-slate-500 font-medium font-mono">Ghar (House)</div>
        </div>

        <!-- Status Messaging Area -->
        <div class="h-14 flex items-center justify-center mb-6">
            <div id="status-listening" class="hidden flex flex-col items-center text-rose-500 font-bold text-lg">
                <span class="animate-bounce">बोलो! (Speak now...)</span>
                <span id="timer-text" class="text-xs font-mono text-slate-400 mt-1">Time left: 10s</span>
            </div>
            <div id="status-success" class="hidden text-emerald-500 flex items-center space-x-2 scale-110 transition-all duration-300">
                <i class="fa-solid fa-circle-check text-3xl"></i>
                <span class="text-lg font-black">ठीक है! 🎉</span>
            </div>
        </div>

        <!-- Circular Countdown Mic Button Container -->
        <div class="relative w-32 h-32 mx-auto flex items-center justify-center">
            <svg class="absolute inset-0 w-full h-full">
                <circle cx="64" cy="64" r="54" stroke="#f1f5f9" stroke-width="8" fill="transparent" />
                <circle id="countdown-circle" class="timer-ring" cx="64" cy="64" r="54" stroke="#f43f5e" stroke-width="8" fill="transparent" stroke-dasharray="339.29" stroke-dashoffset="0" stroke-linecap="round" />
            </svg>

            <button id="mic-btn" class="absolute w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full text-4xl shadow-md transition-all transform active:scale-90 flex items-center justify-center cursor-pointer border-4 border-white z-10">
                <i id="mic-icon" class="fa-solid fa-microphone"></i>
            </button>
        </div>

        <p id="transcript-preview" class="text-sm font-semibold text-slate-400 mt-6 h-4"></p>

        <!-- Retry/Skip Modal Pop Up Box -->
        <div id="retry-modal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
            <div class="bg-white rounded-2xl p-6 max-w-xs w-full shadow-2xl text-center border-4 border-rose-300">
                <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                    <i class="fa-solid fa-face-frown"></i>
                </div>
                <h3 class="text-xl font-black text-slate-800 mb-1">गलत जवाब!</h3>
                <p id="modal-feedback" class="text-sm text-slate-500 mb-6">फिर से कोशिश करो!</p>
                <div class="flex space-x-3">
                    <button id="skip-btn" class="flex-1 py-3 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-sm transition-colors cursor-pointer">
                        Skip ⏭️
                    </button>
                    <button id="retry-btn" class="flex-1 py-3 px-4 bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl text-sm transition-colors cursor-pointer shadow-md shadow-rose-100">
                        Try Again 🔄
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Application Logic -->
    <script>
        const wordData = {
            twoLetter: [
                { hindi: "घर", english: "Ghar (House)", alternatives: ["घार", "कर", "घड़"] },
                { hindi: "फल", english: "Phal (Fruit)", alternatives: ["फाल", "पल", "हल"] },
                { hindi: "बस", english: "Bas (Bus)", alternatives: ["बास", "वश", "बज"] },
                { hindi: "जल", english: "Jal (Water)", alternatives: ["जाल", "चल"] },
                { hindi: "नल", english: "Nal (Tap)", alternatives: ["नाल", "मल"] }
            ],
            threeLetter: [
                { hindi: "कमल", english: "Kamal (Lotus)", alternatives: ["कमाल", "कमड़"] },
                { hindi: "मगर", english: "Magar (Crocodile)", alternatives: ["मागर", "मगरमच्छ"] },
                { hindi: "बटन", english: "Batan (Button)", alternatives: ["बटान", "बटम"] },
                { hindi: "कलम", english: "Kalam (Pen)", alternatives: ["कलाम", "करम"] },
                { hindi: "सड़क", english: "Sadak (Road)", alternatives: ["सडक", "सारक"] }
            ],
            matra: [
                { hindi: "राजा", english: "Raja (King)", alternatives: ["राज", "राज़ा"] },
                { hindi: "किताब", english: "Kitaab (Book)", alternatives: ["कीताब", "किताबें"] },
                { hindi: "मछली", english: "Machhli (Fish)", alternatives: ["मछलीं", "मचली"] },
                { hindi: "गुलाब", english: "Gulaab (Rose)", alternatives: ["गुलाप", "गुलाब का फूल"] },
                { hindi: "सूरज", english: "Sooraj (Sun)", alternatives: ["सूरज", "सुरज"] }
            ]
        };

        let currentCategory = 'twoLetter';
        let currentIndex = 0;
        
        let countdownTimer = null;
        let timeLeft = 10;
        const totalDuration = 10;
        const circleRadius = 54;
        const circumference = 2 * Math.PI * circleRadius;

        // Dynamic recognition variable
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null; 

        // DOM Elements
        const wordEl = document.getElementById('hindi-word');
        const meaningEl = document.getElementById('english-meaning');
        const micBtn = document.getElementById('mic-btn');
        const micIcon = document.getElementById('mic-icon');
        const statusListening = document.getElementById('status-listening');
        const statusSuccess = document.getElementById('status-success');
        const timerText = document.getElementById('timer-text');
        const countdownCircle = document.getElementById('countdown-circle');
        const transcriptPreview = document.getElementById('transcript-preview');
        const retryModal = document.getElementById('retry-modal');
        const retryBtn = document.getElementById('retry-btn');
        const skipBtn = document.getElementById('skip-btn');

        function speakFeedback(textMessage) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Critical: stops overlay loops
                const utterance = new SpeechSynthesisUtterance(textMessage);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.95; 
                window.speechSynthesis.speak(utterance);
            }
        }

        function updateWord() {
            const currentList = wordData[currentCategory];
            wordEl.textContent = currentList[currentIndex].hindi;
            meaningEl.textContent = currentList[currentIndex].english;
            transcriptPreview.textContent = "";
            stopTimerRing();
            resetStatus();
        }

        function resetStatus() {
            statusListening.classList.add('hidden');
            statusSuccess.classList.add('hidden');
            micBtn.className = "absolute w-24 h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full text-4xl shadow-md transition-all transform active:scale-90 flex items-center justify-center cursor-pointer border-4 border-white z-10";
            micIcon.className = "fa-solid fa-microphone";
        }

        function startTimerRing() {
            clearInterval(countdownTimer);
            timeLeft = totalDuration;
            timerText.textContent = `Time left: ${timeLeft}s`;
            countdownCircle.style.strokeDashoffset = 0;
            countdownCircle.style.stroke = "#10b981";

            countdownTimer = setInterval(() => {
                timeLeft--;
                timerText.textContent = `Time left: ${timeLeft}s`;

                const progressPercentage = timeLeft / totalDuration;
                const offset = circumference * (1 - progressPercentage);
                countdownCircle.style.strokeDashoffset = offset;

                if (timeLeft <= 5 && timeLeft > 2) {
                    countdownCircle.style.stroke = "#f59e0b";
                } else if (timeLeft <= 2) {
                    countdownCircle.style.stroke = "#ef4444";
                }

                if (timeLeft <= 0) {
                    handleFailure("समय समाप्त! (Time out)");
                }
            }, 1000);
        }

        function stopTimerRing() {
            clearInterval(countdownTimer);
            countdownCircle.style.strokeDashoffset = 0;
            countdownCircle.style.stroke = "#f43f5e";
        }

        function handleFailure(reasonText, spokenText = "") {
            stopTimerRing();
            if (recognition) {
                recognition.onresult = null;
                recognition.onerror = null;
                try { recognition.stop(); } catch(e){}
            }
            resetStatus();

            speakFeedback("गलत है फिर से कोशिश करें");
            
            const targetWord = wordData[currentCategory][currentIndex].hindi;
            const textToDisplay = spokenText ? `आपने बोला: <span class="text-rose-500 font-bold">"${spokenText}"</span>` : `<span class="text-rose-500 font-semibold">${reasonText}</span>`;
            
            document.getElementById('modal-feedback').innerHTML = `${textToDisplay}<br>सही शब्द: <span class="text-amber-600 font-bold">"${targetWord}"</span>`;
            retryModal.classList.remove('hidden');
        }

        function switchCategory(category) {
            currentCategory = category;
            currentIndex = 0;
            
            document.querySelectorAll('.category-tab').forEach(btn => {
                btn.className = "category-tab px-4 py-2 bg-white text-slate-600 font-bold rounded-full shadow-md text-sm transition-all border-2 border-transparent cursor-pointer";
            });
            const activeTab = document.getElementById(`tab-${category}`);
            activeTab.className = "category-tab px-4 py-2 bg-amber-400 text-amber-900 font-bold rounded-full shadow-md text-sm transition-all border-2 border-amber-500 cursor-pointer";
            
            updateWord();
        }

        // Main Mic Click Logic
        micBtn.addEventListener('click', () => {
            if (!SpeechRecognition) {
                alert("Chrome Browser is recommended!");
                return;
            }

            resetStatus();
            
            // CRITICAL FIX: Kill older instance safely & initialize a brand new instance 
            if (recognition) {
                try { recognition.abort(); } catch(e){}
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            // maxAlternatives: 5 allows the browser to return multiple guesses if unsure
            recognition.maxAlternatives = 5; 
            recognition.interimResults = false;

            statusListening.classList.remove('hidden');
            micBtn.className = "absolute w-24 h-24 bg-slate-800 text-white rounded-full text-4xl shadow-md flex items-center justify-center cursor-pointer border-4 border-white z-10";
            micIcon.className = "fa-solid fa-face-listening animate-pulse";
            
            startTimerRing();

            // Set up runtime bindings dynamically
            recognition.onresult = function(event) {
                clearInterval(countdownTimer); 
                
                const targetObj = wordData[currentCategory][currentIndex];
                const targetWord = targetObj.hindi;
                
                // Read all alternative guesses returned by Chrome's engine
                let alternativeGuesses = [];
                for (let i = 0; i < event.results[0].length; i++) {
                    let text = event.results[0][i].transcript.trim().replace(/[।.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"");
                    alternativeGuesses.push(text);
                }

                const primarySpoken = alternativeGuesses[0];
                transcriptPreview.textContent = `आपने बोला: "${primarySpoken}"`;

                // Smart Check Logic:
                // 1. Check if the exact target word is in any of the engine's alternatives
                // 2. Check if the target word is a substring of what was said (handles padding noise)
                // 3. Check against child phonetic alternative rules defined in database
                let isCorrect = alternativeGuesses.some(guess => 
                    guess === targetWord || 
                    guess.includes(targetWord) ||
                    targetObj.alternatives.includes(guess)
                );

                if (isCorrect) {
                    resetStatus();
                    statusSuccess.classList.remove('hidden');
                    speakFeedback("ठीक है"); 
                    
                    setTimeout(() => {
                        const currentList = wordData[currentCategory];
                        currentIndex = (currentIndex + 1) % currentList.length;
                        updateWord();
                    }, 1800);
                } else {
                    handleFailure(null, primarySpoken);
                }
            };

            recognition.onerror = function(event) {
                if (event.error !== 'no-speech') {
                    handleFailure("आवाज़ स्पष्ट नहीं थी (Unclear Audio)");
                }
            };

            recognition.start();
        });

        // Interactive Modal Actions
        retryBtn.addEventListener('click', () => {
            retryModal.classList.add('hidden');
            // Tiny delay ensures elements clean up nicely before starting the mic engine again
            setTimeout(() => { micBtn.click(); }, 250);
        });

        skipBtn.addEventListener('click', () => {
            retryModal.classList.add('hidden');
            const currentList = wordData[currentCategory];
            currentIndex = (currentIndex + 1) % currentList.length;
            updateWord();
        });

        updateWord();
    </script>
</body>
</html>

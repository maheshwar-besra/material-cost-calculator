<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bal Vani - Hindi Pronunciation for Kids</title>
    <!-- Tailwind CSS for modern fluid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for readable Devanagari script text -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; }
        /* Prevent bounce scrolls on mobile browsers */
        html, body { position: fixed; overflow: hidden; width: 100%; height: 100%; }
    </style>
</head>
<body class="bg-amber-50 h-screen w-screen flex flex-col items-center justify-between p-4 select-none">

    <!-- Header Area (Stays Fixed at Top) -->
    <header class="w-full max-w-md flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border-2 border-amber-200 shrink-0">
        <h1 class="text-lg font-extrabold text-amber-600 tracking-wide">✨ बाल वाणी (Bal Vani)</h1>
        <div class="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full text-xs">
            Progress: <span id="progress-text">1 / 4</span>
        </div>
    </header>

    <!-- Category Tabs (Stays Fixed at Top Sublevel) -->
    <div class="w-full max-w-md flex gap-2 mt-2 shrink-0">
        <button data-category="twoLetter" class="tab-btn flex-1 bg-amber-400 text-amber-950 font-bold py-2 rounded-xl shadow-sm text-xs transition-all border-2 border-amber-500">
            २ अक्षर
        </button>
        <button data-category="threeLetter" class="tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 rounded-xl border-2 border-slate-200 text-xs transition-all">
            ३ अक्षर
        </button>
        <button data-category="matraWords" class="tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 rounded-xl border-2 border-slate-200 text-xs transition-all">
            मात्रा वाले
        </button>
    </div>

    <!-- Main Card Body Layout (Dynamically fits middle remaining space without scrolling) -->
    <main class="w-full max-w-md bg-white flex-1 my-3 rounded-3xl shadow-xl border-4 border-amber-400 p-4 flex flex-col items-center justify-between relative overflow-hidden min-h-0">
        
        <!-- Success Screen Layer -->
        <div id="success-overlay" class="hidden absolute inset-0 bg-emerald-500/95 flex flex-col items-center justify-center text-white z-10 duration-300">
            <span class="text-6xl mb-2 animate-bounce">🎉 🌟 👏</span>
            <h2 class="text-3xl font-black">अद्भुत! (Amazing!)</h2>
            <p class="text-lg mt-1 font-medium">Perfect Pronunciation!</p>
        </div>

        <!-- Word Content Display (Flexible internal auto-scaling sizing) -->
        <div class="flex flex-col items-center justify-center flex-1 min-h-0 w-full py-1">
            <div id="word-emoji" class="text-6xl sm:text-7xl my-1 drop-shadow-md transition-transform duration-300 hover:scale-110 cursor-pointer">🏠</div>
            <h2 id="word-hindi" class="text-4xl sm:text-5xl font-bold text-slate-800 tracking-wide mb-0.5">घर</h2>
            <p id="word-phonetic" class="text-sm sm:text-base font-medium text-slate-400 italic">"Ghar" (House)</p>
        </div>

        <!-- Action Layout Blocks (Anchored perfectly inside container framework) -->
        <div class="w-full flex flex-col gap-3 items-center mt-auto shrink-0">
            
            <!-- Listen Audio Cue Button -->
            <button id="btn-listen" class="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white font-bold px-5 py-2 rounded-full shadow-md transition-all active:scale-95 text-xs sm:text-sm">
                🔊 Listen to Word
            </button>

            <!-- Upscaled Microphone Unit Containing SVG Circular Countdown Progress Bar -->
            <div class="relative w-32 h-32 sm:w-36 sm:h-36 flex items-center justify-center my-1">
                
                <!-- SVG Round Timer Track Outer Ring -->
                <svg class="absolute inset-0 w-full h-full transform -rotate-90 animate-fade-in" viewBox="0 0 100 100">
                    <!-- Background static track guide path -->
                    <circle cx="50" cy="50" r="44" stroke="#f1f5f9" stroke-width="6" fill="transparent" />
                    <!-- Dynamic running progress status loop bar line -->
                    <circle id="progress-circle" cx="50" cy="50" r="44" stroke="#10b981" stroke-width="6" fill="transparent" 
                            stroke-dasharray="276.46" stroke-dashoffset="276.46" stroke-linecap="round" class="transition-all duration-75 ease-linear" />
                </svg>

                <!-- Massive Center Interaction Mic Target Switch Trigger Button Toggle -->
                <button id="btn-mic" class="w-22 h-22 sm:w-26 sm:h-26 bg-rose-500 text-white rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90 border-4 border-white ring-4 ring-rose-100 z-10">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 sm:h-11 sm:w-11 fill-current" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
                
                <!-- Background Pulse Ripple Accent Ring -->
                <div id="mic-ripple" class="hidden absolute inset-4 bg-rose-500 rounded-full opacity-30 animate-ping"></div>
            </div>

            <!-- Context Status Messaging Box Output Screen -->
            <p id="status-msg" class="text-xs font-semibold text-slate-500 tracking-wide bg-slate-100 px-4 py-2 rounded-full h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap">
                Tap the microphone and say the word!
            </p>
        </div>
    </main>

    <!-- Structural Navigation Footer Controls (Firmly Locked to Bottom Layout Plane) -->
    <footer class="w-full max-w-md flex justify-between items-center bg-white p-3 rounded-2xl shadow-sm border-2 border-amber-100 shrink-0 mb-1">
        <button id="btn-prev" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 py-2.5 rounded-xl text-sm transition-all active:scale-95 disabled:opacity-40" disabled>Previous</button>
        <button id="btn-next" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-6 py-2.5 rounded-xl text-sm transition-all active:scale-95">Next ➜</button>
    </footer>

    <!-- EMBEDDED APPLICATION CONTROL CONTROLLER LOGIC ENGINE -->
    <script>
        // Core Vocabulary Storage Layout Dictionary
        const wordDatabase = {
            twoLetter: [
                { hindi: "घर", phonetic: "Ghar", english: "House", emoji: "🏠", matchRegex: /घर|कर|पर|धर/ },
                { hindi: "फल", phonetic: "Phal", english: "Fruit", emoji: "🍎", matchRegex: /फल|पल|चल|हल/ },
                { hindi: "बस", phonetic: "Bas", english: "Bus", emoji: "🚌", matchRegex: /बस|दस|रस|कस/ },
                { hindi: "नल", phonetic: "Nal", english: "Tap", emoji: "🚰", matchRegex: /नल|मल|चल|जल/ }
            ],
            threeLetter: [
                { hindi: "कमल", phonetic: "Kamal", english: "Lotus", emoji: "🪷", matchRegex: /कमल|कमर|कमाल/ },
                { hindi: "मटर", phonetic: "Matar", english: "Peas", emoji: "🫛", matchRegex: /मटर|मदर|गटर|शटर/ },
                { hindi: "बटन", phonetic: "Batan", english: "Button", emoji: "🔘", matchRegex: /बटन|मटन|बतन/ },
                { hindi: "मगर", phonetic: "Magar", english: "Crocodile", emoji: "🐊", matchRegex: /मगर|नगर|अगर/ }
            ],
            matraWords: [
                { hindi: "आम", phonetic: "Aam", english: "Mango", emoji: "🥭", matchRegex: /आम|काम|नाम|शाम/ },
                { hindi: "किताब", phonetic: "Kitaab", english: "Book", emoji: "📖", matchRegex: /किताब|केताब|कताब/ },
                { hindi: "चूहा", phonetic: "Chooha", english: "Mouse", emoji: "🐭", matchRegex: /चूहा|चुआ|चुहा/ },
                { hindi: "शेर", phonetic: "Sher", english: "Lion", emoji: "🦁", matchRegex: /शेर|सेर|सैर/ }
            ]
        };

        // Track Engine Application Runtime Parameters
        let currentCategory = 'twoLetter';
        let currentIndex = 0;
        let countdownInterval = null;
        let processingTimeout = null;
        const TIME_LIMIT = 10; // Exactly 10 Seconds Voice Limit

        // Capture Structural Document Engine Points
        const elEmoji = document.getElementById('word-emoji');
        const elHindi = document.getElementById('word-hindi');
        const elPhonetic = document.getElementById('word-phonetic');
        const elProgress = document.getElementById('progress-text');
        const elStatus = document.getElementById('status-msg');
        const elSuccessOverlay = document.getElementById('success-overlay');
        const elRipple = document.getElementById('mic-ripple');
        const progressBarCircle = document.getElementById('progress-circle');

        const btnListen = document.getElementById('btn-listen');
        const btnMic = document.getElementById('btn-mic');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const tabButtons = document.querySelectorAll('.tab-btn');

        // Recognition Subsystem Web Framework Target Hook
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        } else {
            alert("Your browser does not fully support live Speech-To-Text tracking mechanics. Please preview inside Google Chrome!");
        }

        // Standard Flashcard Component Redraw Framework
        function updateCard() {
            const activeArray = wordDatabase[currentCategory];
            const currentData = activeArray[currentIndex];
            
            elEmoji.textContent = currentData.emoji;
            elHindi.textContent = currentData.hindi;
            elPhonetic.textContent = `"${currentData.phonetic}" (${currentData.english})`;
            elProgress.textContent = `${currentIndex + 1} / ${activeArray.length}`;
            
            elStatus.textContent = "Tap the microphone and say the word!";
            elStatus.className = "text-xs font-semibold text-slate-500 bg-slate-100 px-4 py-2 rounded-full h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap";
            elSuccessOverlay.classList.add('hidden');
            
            btnPrev.disabled = currentIndex === 0;
            btnNext.textContent = currentIndex === activeArray.length - 1 ? "Restart Category ↺" : "Next ➜";
            
            resetMicUI();
        }

        function updateTabStyles() {
            tabButtons.forEach(btn => {
                if (btn.dataset.category === currentCategory) {
                    btn.className = "tab-btn flex-1 bg-amber-400 text-amber-950 font-bold py-2 rounded-xl shadow-sm text-xs transition-all scale-105 border-2 border-amber-500";
                } else {
                    btn.className = "tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 rounded-xl border-2 border-slate-200 text-xs transition-all";
                }
            });
        }

        // Native Text-To-Speech Execution Call
        function speakHindi(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                
                const voices = window.speechSynthesis.getVoices();
                const hindiVoice = voices.find(voice => voice.lang.includes('hi'));
                if (hindiVoice) utterance.voice = hindiVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // Run SVG + Numerical Countdown Track Setup Engine
        function startCountdownTimer() {
            clearInterval(countdownInterval);
            clearTimeout(processingTimeout);
            
            const circumference = 276.46; // 2 * Math.PI * r (44)
            progressBarCircle.style.strokeDasharray = circumference;
            progressBarCircle.style.strokeDashoffset = "0"; // Start completely full

            let elapsedMilli = 0;
            const totalMilli = TIME_LIMIT * 1000;
            const stepInterval = 50; // Refresh rendering framework fluidly every 50ms

            countdownInterval = setInterval(() => {
                elapsedMilli += stepInterval;
                if (elapsedMilli >= totalMilli) {
                    clearInterval(countdownInterval);
                    progressBarCircle.style.strokeDashoffset = circumference;
                } else {
                    // Smoothly drain out the offset track metrics loop
                    const calculatedOffset = circumference * (elapsedMilli / totalMilli);
                    progressBarCircle.style.strokeDashoffset = calculatedOffset;
                }
            }, stepInterval);

            // Strict time-bound enforcement execution limit
            processingTimeout = setTimeout(() => {
                if (recognition) {
                    recognition.stop();
                }
            }, totalMilli);
        }

        // Stop Timer State Elements
        function killCountdownTimers() {
            clearInterval(countdownInterval);
            clearTimeout(processingTimeout);
            progressBarCircle.style.strokeDashoffset = "276.46"; // Empty out progress track ring cleanly
        }

        // Swap Microphone UI presentation to Active Green
        function setMicActiveUI() {
            btnMic.classList.remove('bg-rose-500', 'ring-rose-100');
            btnMic.classList.add('bg-emerald-500', 'ring-emerald-100');
            elRipple.classList.remove('bg-rose-500', 'hidden');
            elRipple.classList.add('bg-emerald-500');
        }

        // Restore Microphone UI baseline configuration state to Red
        function resetMicUI() {
            btnMic.classList.remove('bg-emerald-500', 'ring-emerald-100');
            btnMic.classList.add('bg-rose-500', 'ring-rose-100');
            elRipple.classList.remove('bg-emerald-500');
            elRipple.classList.add('bg-rose-500', 'hidden');
            killCountdownTimers();
        }

        // Configure Subsystem Event Hooks
        if (recognition) {
            btnMic.addEventListener('click', () => {
                try {
                    recognition.start();
                    setMicActiveUI();
                    startCountdownTimer();
                    elStatus.textContent = "Listening closely... Speak now! 🎙️";
                    elStatus.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-full border border-emerald-200 animate-pulse h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap";
                } catch (e) {
                    recognition.stop();
                }
            });

            recognition.onresult = (event) => {
                killCountdownTimers();
                resetMicUI();
                
                const spokenText = event.results[0][0].transcript.trim();
                const activeArray = wordDatabase[currentCategory];
                const targetWord = activeArray[currentIndex];

                if (targetWord.matchRegex.test(spokenText)) {
                    // Success Path Flow
                    elSuccessOverlay.classList.remove('hidden');
                    speakHindi("सही है");
                    
                    setTimeout(() => {
                        if (currentIndex < activeArray.length - 1) {
                            currentIndex++;
                            updateCard();
                        } else {
                            elSuccessOverlay.classList.add('hidden');
                            elStatus.textContent = "🥳 Category Complete! Try another category above!";
                            elStatus.className = "text-xs font-semibold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-full border border-emerald-300 h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap";
                        }
                    }, 2200);
                } else {
                    // Failure Verbal Response Routing
                    speakHindi("गलत है, फिर से कोशिश करें");
                    elStatus.innerHTML = `You said: <strong class="text-rose-700">"${spokenText}"</strong>. Try again!`;
                    elStatus.className = "text-xs font-semibold text-amber-700 bg-amber-100 px-4 py-2 rounded-full border border-amber-300 h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap";
                }
            };

            recognition.onerror = (event) => {
                resetMicUI();
                if (event.error === 'no-speech') {
                    speakHindi("गलत है, फिर से कोशिश करें");
                    elStatus.textContent = "Time out! No speech detected. Try again!";
                } else {
                    elStatus.textContent = "Microphone error. Please review system access configurations.";
                }
                elStatus.className = "text-xs font-semibold text-slate-500 bg-slate-100 px-4 py-2 rounded-full h-10 flex items-center text-center justify-center w-full overflow-hidden text-ellipsis whitespace-nowrap";
            };

            recognition.onend = () => {
                resetMicUI();
            };
        }

        // Structural Component Action Event Attachments
        btnListen.addEventListener('click', () => {
            speakHindi(wordDatabase[currentCategory][currentIndex].hindi);
        });

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        btnNext.addEventListener('click', () => {
            const activeArray = wordDatabase[currentCategory];
            if (currentIndex < activeArray.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                currentIndex = 0;
                updateCard();
            }
        });

        tabButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                currentCategory = e.currentTarget.dataset.category;
                currentIndex = 0;
                updateTabStyles();
                updateCard();
            });
        });

        // Initialize Native Runtime Instance Configurations
        updateCard();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>

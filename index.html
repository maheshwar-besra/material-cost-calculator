<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Karaoke Audio Sync - Fixed</title>
    <style>
        :root {
            --bg-color: #0a0a0c;
            --card-bg: rgba(20, 20, 27, 0.85);
            --accent-color: #00ffcc;
            --text-muted: #4a4a5a;
            --error-color: #ff4757;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 50%, #1a1525 0%, var(--bg-color) 80%);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 50px 40px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .audio-btn {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            outline: none;
        }

        .audio-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.2);
            transform: translateY(-2px);
        }

        .audio-btn.playing {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .transcript-box {
            min-height: 160px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 10px 14px;
            margin-top: 40px;
            padding: 10px;
        }

        .word {
            font-size: 30px;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-muted);
            opacity: 0.2;
            transform: scale(0.95);
            transition: all 0.25s ease;
            display: inline-block;
        }

        .word.active {
            opacity: 1;
            color: #ffffff;
            transform: scale(1.15);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }

        .word.passed {
            opacity: 0.75;
            color: var(--accent-color);
            transform: scale(1);
        }

        #statusMessage {
            margin-top: 15px;
            font-size: 14px;
            color: var(--error-color);
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <button id="playBtn" class="audio-btn">
        <span id="btnIcon">►</span>
        <span id="btnText">प्ले ऑडियो</span>
    </button>
    
    <div id="statusMessage"></div>

    <audio id="myAudio" src="m.mp3" loop preload="auto"></audio>

    <div id="transcriptBox" class="transcript-box"></div>
</div>

<script>
    const audio = document.getElementById('myAudio');
    const playBtn = document.getElementById('playBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const transcriptBox = document.getElementById('transcriptBox');
    const statusMessage = document.getElementById('statusMessage');

    // ऑडियो टाइमलाइन डेटा
    const wordsTimeline = [
        { word: "थी", time: 0.0 }, { word: "जब", time: 0.8 }, { word: "लोग", time: 1.3 },
        { word: "मरने", time: 2.2 }, { word: "के", time: 2.7 }, { word: "करीब", time: 3.1 }, { word: "होते", time: 3.6 }, { word: "हैं,", time: 4.0 },
        { word: "आखिरी", time: 4.4 }, { word: "सांसें", time: 5.0 }, { word: "लेते", time: 5.5 }, { word: "हैं।", time: 5.9 },
        { word: "वो", time: 6.6 }, { word: "पछतावे", time: 7.0 }, { word: "जताते", time: 7.7 }, { word: "हैं,", time: 8.1 },
        { word: "जैसे", time: 8.4 }, { word: "क्या", time: 8.8 }, { word: "करना", time: 9.1 }, { word: "चाहिए", time: 9.5 }, { word: "था,", time: 9.9 },
        { word: "जिससे", time: 10.3 }, { word: "ठीक", time: 10.7 }, { word: "होता,", time: 11.1 },
        { word: "जो", time: 11.5 }, { word: "उस", time: 11.7 }, { word: "वक्त", time: 11.9 }, { word: "उन्होंने", time: 12.2 }, { word: "नहीं", time: 12.5 }, { word: "किया।", time: 12.8 },
        { word: "कि", time: 13.5 }, { word: "अगर", time: 13.9 }, { word: "मौत", time: 14.3 }, { word: "के", time: 14.7 }, { word: "वक्त", time: 15.0 },
        { word: "तुम्हें", time: 15.4 }, { word: "पछतावा", time: 15.8 }, { word: "हो...", time: 16.7 },
        { word: "तो", time: 17.6 }, { word: "जिंदगी", time: 18.2 }, { word: "गलत", time: 19.0 }, { word: "तरीके", time: 19.4 }, { word: "से", time: 19.7 }, { word: "जी।", time: 19.9 }
    ];

    // शब्दों को स्क्रीन पर लोड करना
    function generateWords() {
        transcriptBox.innerHTML = '';
        wordsTimeline.forEach((item, index) => {
            const span = document.createElement('span');
            span.innerText = item.word;
            span.classList.add('word');
            span.setAttribute('id', `word-${index}`);
            transcriptBox.appendChild(span);
        });
    }
    generateWords();

    // प्ले/पॉज़ फंक्शनलिटी (त्रुटि जाँच के साथ)
    playBtn.addEventListener('click', () => {
        if (audio.paused) {
            audio.play().then(() => {
                statusMessage.style.display = "none";
                playBtn.classList.add('playing');
                btnText.innerText = "पॉज़ ऑडियो";
                btnIcon.innerText = "║";
            }).catch(error => {
                console.error("Audio playback failed:", error);
                statusMessage.style.display = "block";
                statusMessage.innerText = "त्रुटि: ऑडियो फ़ाइल 'm.mp3' नहीं मिल सकी या लोड नहीं हो पाई।";
            });
        } else {
            audio.pause();
            playBtn.classList.remove('playing');
            btnText.innerText = "प्ले ऑडियो";
            btnIcon.innerText = "►";
        }
    });

    // वर्ड-बाय-वर्ड रियल टाइम ट्रैकिंग
    audio.addEventListener('timeupdate', () => {
        const currentTime = audio.currentTime;

        wordsTimeline.forEach((item, index) => {
            const wordElement = document.getElementById(`word-${index}`);
            if (!wordElement) return;
            
            const nextItem = wordsTimeline[index + 1];
            const isCurrentWord = currentTime >= item.time && (!nextItem || currentTime < nextItem.time);
            const isPassedWord = currentTime >= item.time;

            if (isCurrentWord) {
                wordElement.className = 'word active';
            } else if (isPassedWord) {
                wordElement.className = 'word passed';
            } else {
                wordElement.className = 'word';
            }
        });
    });

    // लूप रीसेट होने पर एनिमेशन साफ़ करना
    audio.addEventListener('seeked', () => {
        if (audio.currentTime < 1) {
            wordsTimeline.forEach((_, index) => {
                const wordElement = document.getElementById(`word-${index}`);
                if (wordElement) wordElement.className = 'word';
            });
        }
    });

    // ऑडियो लोड एरर हैंडलर
    audio.addEventListener('error', () => {
        statusMessage.style.display = "block";
        statusMessage.innerText = "Error: 'm.mp3' फ़ाइल लोड करने में विफल। कृपया फ़ाइल नाम और पाथ की जाँच करें।";
    });
</script>

</body>
</html>

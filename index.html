<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bal Vani - Hindi Pronunciation for Kids</title>
    <!-- Tailwind CSS Play CDN for bright, beautiful styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for crisp Devanagari script text and playful look -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif; }
    </style>
</head>
<body class="bg-amber-50 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Header / Progress Area -->
    <header class="w-full max-w-md flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm border-2 border-amber-200">
        <h1 class="text-xl font-extrabold text-amber-600 tracking-wide">✨ बाल वाणी (Bal Vani)</h1>
        <div class="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full text-sm">
            Progress: <span id="progress-text">1 / 4</span>
        </div>
    </header>

    <!-- Category Selector Tabs -->
    <div class="w-full max-w-md flex gap-2 mt-4">
        <button data-category="twoLetter" class="tab-btn flex-1 bg-amber-400 text-amber-950 font-bold py-2 px-1 sm:px-3 rounded-xl shadow-sm text-xs sm:text-sm transition-all border-2 border-amber-500">
            २ अक्षर
        </button>
        <button data-category="threeLetter" class="tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 px-1 sm:px-3 rounded-xl border-2 border-slate-200 text-xs sm:text-sm transition-all">
            ३ अक्षर
        </button>
        <button data-category="matraWords" class="tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 px-1 sm:px-3 rounded-xl border-2 border-slate-200 text-xs sm:text-sm transition-all">
            मात्रा वाले
        </button>
    </div>

    <!-- Main Flashcard Container -->
    <main class="w-full max-w-md bg-white my-auto mt-4 rounded-3xl shadow-xl border-4 border-amber-400 p-6 sm:p-8 flex flex-col items-center text-center relative overflow-hidden">
        
        <!-- Confetti/Star Effect Layer (Hidden by default) -->
        <div id="success-overlay" class="hidden absolute inset-0 bg-emerald-500/90 flex flex-col items-center justify-center text-white z-10 duration-300">
            <span class="text-6xl mb-4 animate-bounce">🎉 🌟 👏</span>
            <h2 class="text-3xl font-black">अद्भुत! (Amazing!)</h2>
            <p class="text-lg mt-2 font-medium">Perfect Pronunciation!</p>
        </div>

        <!-- Word Assets -->
        <div id="word-emoji" class="text-7xl sm:text-8xl my-2 sm:my-4 drop-shadow-md transition-transform duration-300 hover:scale-110 cursor-pointer">🏠</div>
        
        <h2 id="word-hindi" class="text-5xl sm:text-6xl font-bold text-slate-800 tracking-wide mb-1 select-none">घर</h2>
        <p id="word-phonetic" class="text-lg sm:text-xl font-medium text-slate-400 italic mb-6">"Ghar" (House)</p>

        <!-- Action Buttons -->
        <div class="w-full flex flex-col gap-4 items-center">
            
            <!-- Listen Button -->
            <button id="btn-listen" class="flex items-center gap-2 bg-blue-500 hover:bg-blue-600 text-white font-bold px-6 py-3 rounded-full shadow-md transition-all active:scale-95 text-base sm:text-lg">
                🔊 Listen to Word
            </button>

            <!-- Mic Button Wrapper for Animation Effects -->
            <div class="relative my-2 sm:my-4">
                <button id="btn-mic" class="w-20 h-20 sm:w-24 sm:h-24 bg-rose-500 hover:bg-rose-600 text-white rounded-full flex items-center justify-center shadow-lg transition-all active:scale-90 border-4 border-white ring-4 ring-rose-200">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 fill-current" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/>
                    </svg>
                </button>
                <!-- Ripple effect when recording -->
                <div id="mic-ripple" class="hidden absolute inset-0 bg-rose-500 rounded-full anonymity opacity-40 animate-ping -z-10"></div>
            </div>

            <!-- Status Guidance Message -->
            <p id="status-msg" class="text-sm font-semibold text-slate-500 tracking-wide bg-slate-100 px-4 py-2 rounded-full min-h-[40px] flex items-center text-center justify-center w-full">
                Tap the microphone and say the word!
            </p>
        </div>
    </main>

    <!-- Footer Controls -->
    <footer class="w-full max-w-md flex justify-between items-center mt-2">
        <button id="btn-prev" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-5 py-2 rounded-xl transition-all disabled:opacity-40" disabled>Previous</button>
        <button id="btn-next" class="bg-amber-400 hover:bg-amber-500 text-amber-950 font-bold px-5 py-2 rounded-xl transition-all">Next ➜</button>
    </footer>

    <!-- INTERACTIVE APP LOGIC -->
    <script>
        // Categorized Word Database
        const wordDatabase = {
            twoLetter: [
                { hindi: "घर", phonetic: "Ghar", english: "House", emoji: "🏠", matchRegex: /घर|कर|पर|धर/ },
                { hindi: "फल", phonetic: "Phal", english: "Fruit", emoji: "🍎", matchRegex: /फल|पल|चल|हल/ },
                { hindi: "बस", phonetic: "Bas", english: "Bus", emoji: "🚌", matchRegex: /बस|दस|रस|कस/ },
                { hindi: "नल", phonetic: "Nal", english: "Tap", emoji: "🚰", matchRegex: /नल|मल|चल|जल/ }
            ],
            threeLetter: [
                { hindi: "कमल", phonetic: "Kamal", english: "Lotus", emoji: "🪷", matchRegex: /कमल|कमर|कमाल/ },
                { hindi: "मटर", phonetic: "Matar", english: "Peas", emoji: "🫛", matchRegex: /मटर|मदर|गटर|शटर/ },
                { hindi: "बटन", phonetic: "Batan", english: "Button", emoji: "🔘", matchRegex: /बटन|मटन|बतन/ },
                { hindi: "मगर", phonetic: "Magar", english: "Crocodile", emoji: "🐊", matchRegex: /मगर|नगर|अगर/ }
            ],
            matraWords: [
                { hindi: "आम", phonetic: "Aam", english: "Mango", emoji: "🥭", matchRegex: /आम|काम|नाम|शाम/ },
                { hindi: "किताब", phonetic: "Kitaab", english: "Book", emoji: "📖", matchRegex: /किताब|केताब|कताब/ },
                { hindi: "चूहा", phonetic: "Chooha", english: "Mouse", emoji: "🐭", matchRegex: /चूहा|चुआ|चुहा/ },
                { hindi: "शेर", phonetic: "Sher", english: "Lion", emoji: "🦁", matchRegex: /शेर|सेर|सैर/ }
            ]
        };

        // App States
        let currentCategory = 'twoLetter';
        let currentIndex = 0;

        // UI Target Elements
        const elEmoji = document.getElementById('word-emoji');
        const elHindi = document.getElementById('word-hindi');
        const elPhonetic = document.getElementById('word-phonetic');
        const elProgress = document.getElementById('progress-text');
        const elStatus = document.getElementById('status-msg');
        const elSuccessOverlay = document.getElementById('success-overlay');
        const elRipple = document.getElementById('mic-ripple');

        const btnListen = document.getElementById('btn-listen');
        const btnMic = document.getElementById('btn-mic');
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const tabButtons = document.querySelectorAll('.tab-btn');

        // Setup Native Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.lang = 'hi-IN'; // Lock engine into native Hindi parsing
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
        } else {
            alert("Speech recognition isn't fully supported in this browser version. Try opening this preview inside Google Chrome!");
        }

        // Render Current Word Card Info
        function updateCard() {
            const activeArray = wordDatabase[currentCategory];
            const currentData = activeArray[currentIndex];
            
            elEmoji.textContent = currentData.emoji;
            elHindi.textContent = currentData.hindi;
            elPhonetic.textContent = `"${currentData.phonetic}" (${currentData.english})`;
            elProgress.textContent = `${currentIndex + 1} / ${activeArray.length}`;
            
            // Clear prior status messages smoothly
            elStatus.textContent = "Tap the microphone and say the word!";
            elStatus.className = "text-sm font-semibold text-slate-500 bg-slate-100 px-4 py-2 rounded-full min-h-[40px] flex items-center text-center justify-center w-full";
            elSuccessOverlay.classList.add('hidden');
            
            // Footer Control Rules
            btnPrev.disabled = currentIndex === 0;
            btnNext.textContent = currentIndex === activeArray.length - 1 ? "Restart Category ↺" : "Next ➜";
        }

        // Synchronize tab presentation layout styles
        function updateTabStyles() {
            tabButtons.forEach(btn => {
                if (btn.dataset.category === currentCategory) {
                    btn.className = "tab-btn flex-1 bg-amber-400 text-amber-950 font-bold py-2 px-1 sm:px-3 rounded-xl shadow-sm text-xs sm:text-sm transition-all scale-105 border-2 border-amber-500";
                } else {
                    btn.className = "tab-btn flex-1 bg-white text-slate-600 hover:bg-slate-50 font-semibold py-2 px-1 sm:px-3 rounded-xl border-2 border-slate-200 text-xs sm:text-sm transition-all";
                }
            });
        }

        // Text-To-Speech Driver
        function speakHindi(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop persistent overlapping speech audio
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                
                // Grab systemic native speech engine voice variations if accessible
                const voices = window.speechSynthesis.getVoices();
                const hindiVoice = voices.find(voice => voice.lang.includes('hi'));
                if (hindiVoice) utterance.voice = hindiVoice;

                window.speechSynthesis.speak(utterance);
            }
        }

        // Mic Listening Engine Wire-up
        if (recognition) {
            btnMic.addEventListener('click', () => {
                try {
                    recognition.start();
                    elStatus.textContent = "Listening closely... Speak now! 🎙️";
                    elStatus.className = "text-sm font-semibold text-rose-600 bg-rose-50 px-4 py-2 rounded-full border border-rose-200 animate-pulse min-h-[40px] flex items-center text-center justify-center w-full";
                    elRipple.classList.remove('hidden');
                } catch (e) {
                    recognition.stop(); // Safe escape fallback toggle rule
                }
            });

            recognition.onresult = (event) => {
                elRipple.classList.add('hidden');
                const spokenText = event.results[0][0].transcript.trim();
                const activeArray = wordDatabase[currentCategory];
                const targetWord = activeArray[currentIndex];

                // Regex comparison verification checks
                if (targetWord.matchRegex.test(spokenText)) {
                    elSuccessOverlay.classList.remove('hidden');
                    speakHindi("बहुत बढ़िया"); // Audio confirmation congratulations
                    
                    setTimeout(() => {
                        if (currentIndex < activeArray.length - 1) {
                            currentIndex++;
                            updateCard();
                        } else {
                            elSuccessOverlay.classList.add('hidden');
                            elStatus.textContent = "🥳 Category Complete! Try another category above!";
                            elStatus.className = "text-sm font-semibold text-emerald-700 bg-emerald-50 px-4 py-2 rounded-full border border-emerald-300 min-h-[40px] flex items-center text-center justify-center w-full";
                        }
                    }, 2200);
                } else {
                    elStatus.innerHTML = `You said: <strong class="text-rose-700">"${spokenText}"</strong>. Try again!`;
                    elStatus.className = "text-sm font-semibold text-amber-700 bg-amber-100 px-4 py-2 rounded-full border border-amber-300 min-h-[40px] flex items-center text-center justify-center w-full";
                }
            };

            recognition.onerror = (event) => {
                elRipple.classList.add('hidden');
                if (event.error === 'no-speech') {
                    elStatus.textContent = "I didn't hear anything. Speak closer to the microphone!";
                } else {
                    elStatus.textContent = "Microphone error. Please check your browser permission controls.";
                }
                elStatus.className = "text-sm font-semibold text-slate-500 bg-slate-100 px-4 py-2 rounded-full min-h-[40px] flex items-center text-center justify-center w-full";
            };

            recognition.onend = () => {
                elRipple.classList.add('hidden');
            };
        }

        // Core Event Bindings
        btnListen.addEventListener('click', () => {
            const activeArray = wordDatabase[currentCategory];
            speakHindi(activeArray[currentIndex].hindi);
        });

        btnPrev.addEventListener('click', () => {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        });

        btnNext.addEventListener('click', () => {
            const activeArray = wordDatabase[currentCategory];
            if (currentIndex < activeArray.length - 1) {
                currentIndex++;
                updateCard();
            } else {
                currentIndex = 0; // Return loop cycle to index zero
                updateCard();
            }
        });

        // Category Tab Interaction Listeners
        tabButtons.forEach(button => {
            button.addEventListener('click', (e) => {
                currentCategory = e.currentTarget.dataset.category;
                currentIndex = 0; // Fresh reset baseline navigation index context counter
                updateTabStyles();
                updateCard();
            });
        });

        // Initialize App Configuration on load
        updateCard();
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
